[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrononote"
version = "0.1.0"
description = "Chronological note labeling and storage with citations"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ChronoNote" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "python-dateutil>=2.9",
  "json5>=0.9",
]

[project.scripts]
chrononote = "chrononote.__main__:main"

[tool.setuptools]
packages = ["chrononote"]

